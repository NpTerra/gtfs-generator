server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The editor discovers examples/*.json through this listing, so dropping a
    # new file into docs/examples/ shows up on the next browser refresh.
    location /examples/ {
        autoindex on;
        autoindex_format json;
        # always revalidate, so a fresh refresh sees newly dropped files
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
