server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html always revalidates, so a redeploy shows up on the next load
    add_header Cache-Control "no-cache";

    # everything else is content-hashed by the build: cache it for good
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
